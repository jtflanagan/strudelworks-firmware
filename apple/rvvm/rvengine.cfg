# ld65 layout of the RISC-V engine's 65816 VM: one bank of its own (the card: $F1, our ROM space - $F0 is the panel, $F8 the ROM's ROMTOOLS probe).
# RVCODE: RISC-V code the runtime runs in place (apple/rvvm/rt, built by apple/rvvm/rt/build.sh).
MEMORY { VM: start = $F10000, size = $10000, file = %O; }
SEGMENTS {
    HEADER: load = VM, type = ro, start = $F10000;
    CODE:   load = VM, type = ro;
    RODATA: load = VM, type = ro;
    RVCODE: load = VM, type = ro, start = $F1E000;
}

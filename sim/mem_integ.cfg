MEMORY {
    ROM: start = $F000, size = $0FFA, file = %O, fill = yes, fillval = $EA;
    VEC: start = $FFFA, size = $0006, file = %O, fill = yes;
    RAM: start = $6000, size = $2000, file = "";
}
SEGMENTS {
    BOOT:    load = ROM, type = ro;
    CODE:    load = ROM, run = RAM, type = ro, define = yes;
    VECTORS: load = VEC, type = ro;
}
